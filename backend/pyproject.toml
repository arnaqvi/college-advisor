[project]
name = "college-advisor-backend"
version = "0.1.0"
description = "College Advisor — FastAPI backend"
authors = [{ name = "EvolveML" }]
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi (>=0.115.0,<0.116.0)",
    "uvicorn[standard] (>=0.32.0,<0.33.0)",
    "pydantic (>=2.9.0,<3.0.0)",
    "pydantic-settings (>=2.6.0,<3.0.0)",
    "sqlalchemy[asyncio] (>=2.0.35,<3.0.0)",
    "asyncpg (>=0.30.0,<0.31.0)",
    "aiosqlite (>=0.20.0,<0.21.0)",
    "azure-storage-blob (>=12.23.0,<13.0.0)",
    "python-multipart (>=0.0.12,<0.0.13)",
    "typing-extensions (>=4.16.0,<5.0.0)",
    # Runtime dep as of the College Scorecard sync job
    # (app/services/scorecard_sync.py) — previously only a test-client dep.
    "httpx (>=0.27.2,<0.29.0)",
    "passlib[argon2] (>=1.7.4,<2.0.0)",
    "itsdangerous (>=2.2.0,<3.0.0)",
    "authlib (>=1.7.2,<2.0.0)",
    "argon2-cffi (>=25.1.0,<26.0.0)",
    "stripe (>=15.4.0,<16.0.0)",
    "anthropic (>=0.121.0,<0.122.0)",
]

[tool.poetry]
packages = [{ include = "app" }]

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.3"
pytest-asyncio = "^0.24.0"
ruff = "^0.7.4"
mypy = "^1.13.0"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100

[tool.mypy]
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
