server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Health check endpoint
    location /health {
        access_log off;
        return 200 '{"status":"healthy"}';
        add_header Content-Type application/json;
    }

    # Proxy API calls to the backend — uvicorn, running as a sibling process
    # in THIS SAME container via docker/entrypoint.sh, reachable over plain
    # loopback. No K8s Service, no DNS resolver, no oauth2-proxy in the path
    # at all for this hop.
    #
    # History (see .lab-meta.json / 2026-07-28 incident commits for the
    # full writeup): this used to proxy_pass to a *separate* K8s Service
    # (college-advisor-api) for a separately-deployed backend app. That
    # never actually worked in production, for two stacked reasons: (1) a
    # DNS bug — nginx's own resolver does a raw query for exactly the
    # hostname given and doesn't apply normal pod search-domain expansion,
    # so even a same-namespace bare short service name failed to resolve;
    # (2) more fundamentally, that Service only ever routed to the
    # backend's OWN oauth2-proxy sidecar (every deployed app on this
    # platform gets one, no exceptions — Mandatory Rule 3), which has no
    # auth-bypass for internal/server-to-server callers, so even correct
    # DNS would have produced a 302-to-Microsoft-login instead of JSON.
    # Merging frontend+backend into one pod (this file's current form)
    # sidesteps both problems permanently — there is no separate Service or
    # sidecar in this request path to break.
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # nginx's 60s default read timeout is too short for the AI Advisor
        # chat and (especially) the multi-search admissions-bias research
        # call — both can run a real multi-round LLM turn past a minute.
        # Confirmed live: a 5-search bias-research request 504'd from nginx
        # itself (backend never even errored) before this was added.
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    # Serve static files, fall back to index.html for SPA routing.
    # index.html itself must NEVER be long-cached — it's the only thing that
    # references the current build's hashed JS/CSS filenames (Vite content-
    # hashes those, so THEY are safe to cache for a year, below). Without
    # this, a browser can serve a stale cached index.html pointing at an old
    # deploy's asset hashes indefinitely, and every "I redeployed but the
    # fix isn't showing" report traces back to exactly that — no-cache here
    # forces a cheap revalidation (a 304 round-trip, not a full re-download)
    # on every visit instead.
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
